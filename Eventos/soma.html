<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Somando numeros </title>

    <style> 
        body{
            font-size: 30px;
            background-color: rgb(229, 255, 195);
        }

        div#resultado{
            margin-top: 20px;
            font-size: 33px;
        }

        input{
            width: 100px;
            height: 30px;
        }
        
    </style>
</head>
<body>
    <h1> Somar valores </h1>
    <input type="number" id="tn1" placeholder="digite o primeiro numero..">
    +
    <input type="number" id="tn2" placeholder=" digite o segundo numero...">

    <input type="button" value="somar" onclick= "somar()">

    <div id="resultado"> Resultado </div>


    
    <script>
        function somar() {
            var tn1 = document.getElementById('tn1');
            var tn2 = document.getElementById ('tn2');
            var res = document.getElementById('resultado');
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)

            var soma = n1 + n2;

            res.innerHTML= `A soma entre ${n1} mais ${n2} deu: ${soma}`

            
        }

        
    </script>
    
</body>
</html>
